<script type="text/babel">
// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────────
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;
const TweaksContext = React.createContext(null);
const _tweaksRef = { current: null };
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  _tweaksRef.current = [values, setTweak];
  return [values, setTweak];
}
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current; if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) ro.observe(document.documentElement); else window.addEventListener('resize', clampToViewport);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', clampToViewport); };
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = e => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = ev => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <TweaksContext.Provider value={_tweaksRef.current}>
        <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      </TweaksContext.Provider>
    </>
  );
}
function TweakSection({ label, title, children }) {
  return <><div className="twk-sect">{title ?? label}</div>{children}</>;
}
function TweakToggle({ id, label, value, onChange }) {
  const ctx = React.useContext(TweaksContext);
  const val = value !== undefined ? value : (ctx?.[0]?.[id] ?? false);
  const change = onChange ?? (v => ctx?.[1]?.(id, v));
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={val ? '1' : '0'} role="switch" aria-checked={!!val} onClick={() => change(!val)}><i /></button>
    </div>
  );
}
function TweakRadio({ id, label, value, options, onChange }) {
  const ctx = React.useContext(TweaksContext);
  const val = value !== undefined ? value : ctx?.[0]?.[id];
  const change = onChange ?? (v => ctx?.[1]?.(id, v));
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === val));
  const n = opts.length;
  const valRef = React.useRef(val); valRef.current = val;
  const segAt = cx => { const r = trackRef.current.getBoundingClientRect(); return opts[Math.max(0, Math.min(n-1, Math.floor(((cx-r.left-2)/(r.width-4))*n)))].value; };
  const onPointerDown = e => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valRef.current) change(v0);
    const move = ev => { const v = segAt(ev.clientX); if (v !== valRef.current) change(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === val}>{o.label}</button>)}
      </div>
    </div>
  );
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakRadio });
</script>

}

// ─── COURT SVG (tennis or pickleball layout) ─────────────────────────────────
function CourtSVG({type, sport="tennis"}) {
  const L = "rgba(255,255,255,0.55)";
  const S = "rgba(255,255,255,0.32)";
  const W = 130, H = 60;
  const ml = 5, mr = W-5, mt = 4, mb = H-4;
  const net = W / 2;
  const cy = (mt + mb) / 2;

  if (sport === "pickleball") {
    // 20×44 ft court, net middle, kitchen extends 7ft each side of net
    const kFrac = 7 / 22; // kitchen depth / half-court length
    const kL = net - (net - ml) * kFrac;
    const kR = net + (mr - net) * kFrac;
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none">
        <rect x={ml} y={mt} width={mr-ml} height={mb-mt} stroke={L} strokeWidth="1.8"/>
        {/* kitchen (non-volley zone) — filled lightly */}
        <rect x={kL} y={mt} width={kR-kL} height={mb-mt} fill="rgba(255,255,255,0.08)"/>
        {/* kitchen lines */}
        <line x1={kL} y1={mt} x2={kL} y2={mb} stroke={L} strokeWidth="1.2"/>
        <line x1={kR} y1={mt} x2={kR} y2={mb} stroke={L} strokeWidth="1.2"/>
        {/* centerline in service area (does NOT cross kitchen) */}
        <line x1={ml} y1={cy} x2={kL} y2={cy} stroke={S} strokeWidth="1.1"/>
        <line x1={kR} y1={cy} x2={mr} y2={cy} stroke={S} strokeWidth="1.1"/>
        {/* net */}
        <line x1={net} y1={mt} x2={net} y2={mb} stroke={L} strokeWidth="2.2" strokeDasharray="3 2"/>
        <circle cx={net} cy={mt} r="1.8" fill={L}/>
        <circle cx={net} cy={mb} r="1.8" fill={L}/>
      </svg>
    );
  }

  // Tennis layout
  const alley = (mb - mt) * (4.5/36);
  const st = mt + alley, sb = mb - alley;
  const svcFrac = 21/39;
  const svcL = net - (net - ml) * svcFrac;
  const svcR = net + (mr - net) * svcFrac;
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none">
      <rect x={ml} y={mt} width={mr-ml} height={mb-mt} stroke={L} strokeWidth="1.8"/>
      <line x1={ml} y1={st} x2={mr} y2={st} stroke={S} strokeWidth="1.1"/>
      <line x1={ml} y1={sb} x2={mr} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={net} y1={mt} x2={net} y2={mb} stroke={L} strokeWidth="2.2"/>
      <circle cx={net} cy={mt} r="1.8" fill={L}/>
      <circle cx={net} cy={mb} r="1.8" fill={L}/>
      <line x1={svcL} y1={st} x2={svcL} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={svcR} y1={st} x2={svcR} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={svcL} y1={cy} x2={svcR} y2={cy} stroke={S} strokeWidth="1.1"/>
      <line x1={ml} y1={cy-2.5} x2={ml} y2={cy+2.5} stroke={L} strokeWidth="1.6"/>
      <line x1={mr} y1={cy-2.5} x2={mr} y2={cy+2.5} stroke={L} strokeWidth="1.6"/>
    </svg>
  );
}

// Replace Google Places photo size suffix (e.g. =s4800-w800-h600) with desired w/h
function resizeGooglePhoto(url, w, h) {
  if (!url) return url;
  return url.replace(/=[swh\d-]+$/, `=w${w}-h${h}`);
}

  return court.featured === true;
}

// Great-circle distance in kilometers between two lat/lng points
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function MapSection({tennisCourts, pickleballCourts, onSelectCourt, lang}) {
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersRef = useRef([]);
  const userMarkerRef = useRef(null);
  const [mapSport, setMapSport] = useState("tennis");
  const [mapFilterType, setMapFilterType] = useState("all");
  const [mapToggles, setMapToggles] = useState({indoor:false, aircon:false, nightLights:false, hasBTS:false});
  const [userLoc, setUserLoc] = useState(null);
  const [locating, setLocating] = useState(false);
  const [locError, setLocError] = useState(null);

  // tennis types ≠ pickleball types — reset เมื่อสลับกีฬาเพื่อไม่ให้ filter หลุด state
  useEffect(() => { setMapFilterType("all"); }, [mapSport]);

  const baseCourts = mapSport === "tennis" ? tennisCourts
                  : mapSport === "pickleball" ? pickleballCourts
                  : [...tennisCourts, ...pickleballCourts];
  const courts = baseCourts.filter(c => {
    if (mapFilterType!=="all" && !courtHasType(c, mapFilterType)) return false;
    if (mapToggles.indoor && !c.indoor) return false;
    if (mapToggles.aircon && !c.aircon) return false;
    if (mapToggles.nightLights && !c.nightLights) return false;
    if (mapToggles.hasBTS && !c.bts) return false;
    return true;
  });

  const availableMapTypes = mapSport==="tennis" ? ["all","hard","clay","grass"]
                         : mapSport==="pickleball" ? ["all","hard"]
                         : ["all"];

  useEffect(() => {
    if (!mapRef.current || leafletMap.current) return;
    const L = window.L;
    const map = L.map(mapRef.current, { center:[13.7563,100.5018], zoom:11.4, zoomControl:false });
    L.control.zoom({ position:"bottomright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution:'© OSM © CARTO', maxZoom:19,
    }).addTo(map);
    leafletMap.current = map;
    return () => { map.remove(); leafletMap.current = null; userMarkerRef.current = null; delete window.__selectCourt; };
  }, []);

  useEffect(() => {
    const map = leafletMap.current;
    if (!map) return;
    const L = window.L;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    courts.forEach(court => {
      const label = court.id < 100 ? court.id : court.id - 100;
      const featured = isFeatured(court);
      const distStr = userLoc ? ` · ${haversineKm(userLoc.lat, userLoc.lng, court.lat, court.lng).toFixed(1)} km` : "";
      const m = L.marker([court.lat, court.lng], { icon: L.divIcon({
        className:"",
        html:`<div style="width:30px;height:30px;border-radius:50%;background:${featured?"#d9e34a":"#fff"};color:#000;border:3px solid #000;font-family:-apple-system,sans-serif;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;">${label}</div>`,
        iconSize:[30,30], iconAnchor:[15,15],
      })}).addTo(map).bindPopup(`
        <div style="font-family:-apple-system,sans-serif;min-width:220px;padding:14px 16px;letter-spacing:-0.01em">
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#86868b;margin-bottom:4px">${court.district}${court.bts?` · ${court.bts.replace(/^(BTS|MRT)\\s*/,"")}`:""}${distStr}</div>
          <div style="font-weight:600;font-size:17px;margin-bottom:4px;letter-spacing:-0.02em">${lang==="en"?court.name:court.nameTh}</div>
          <div style="font-size:12px;color:#86868b;margin-bottom:10px">${lang==="en"?court.nameTh:court.name}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
            <span style="font-weight:600;font-size:18px;letter-spacing:-0.02em">${court.priceMin==null?"—":court.priceMin===0?(lang==="en"?"Free":"ฟรี"):"฿"+court.priceMin.toLocaleString()}${court.priceMin>0?`<span style="font-size:12px;color:#86868b;font-weight:400">/${lang==="en"?"hr":"ชม."}</span>`:""}</span>
            <span style="color:#86868b;font-size:12px">★ ${court.rating!=null?court.rating.toFixed(1):"—"}${court.reviews>0?` · ${court.reviews}`:""}</span>
          </div>
          <button onclick="window.__selectCourt(${court.id})" style="width:100%;padding:9px;background:#1d1d1f;color:#fff;border:none;border-radius:980px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">${lang==="en"?"View details":"ดูรายละเอียด"} ›</button>
        </div>`, { maxWidth:260 });
      markersRef.current.push(m);
    });
    window.__selectCourt = id => {
      const c = courts.find(c=>c.id===id);
      if (c) onSelectCourt(c);
    };
  }, [courts, lang, userLoc]);

  // Auto-fit bounds when sport filter changes (skip "all" — keep default Bangkok view)
  useEffect(() => {
    const map = leafletMap.current;
    if (!map || mapSport === "all" || courts.length === 0) return;
    const L = window.L;
    map.flyToBounds(L.latLngBounds(courts.map(c => [c.lat, c.lng])), { padding:[50,50], duration:0.6, maxZoom:14 });
  }, [mapSport]);

  // User location marker
  useEffect(() => {
    const map = leafletMap.current;
    if (!map || !userLoc) return;
    const L = window.L;
    if (userMarkerRef.current) userMarkerRef.current.remove();
    userMarkerRef.current = L.marker([userLoc.lat, userLoc.lng], {
      icon: L.divIcon({ html:`<div class="user-loc-pin"></div>`, className:"", iconSize:[18,18], iconAnchor:[9,9] }),
      interactive: false,
      zIndexOffset: 1000,
    }).addTo(map);
  }, [userLoc]);

  const handleNearMe = () => {
    setLocError(null);
    if (!navigator.geolocation) {
      setLocError(lang==="en" ? "Geolocation not supported by your browser" : "เบราว์เซอร์ไม่รองรับ geolocation");
      return;
    }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        setUserLoc({ lat: latitude, lng: longitude });
        leafletMap.current?.flyTo([latitude, longitude], 14, { duration: 0.8 });
        setLocating(false);
      },
      err => {
        setLocating(false);
        const msgs = {
          1: lang==="en" ? "Permission denied — please allow location in browser settings" : "ไม่ได้รับอนุญาต — โปรดอนุญาตการใช้ตำแหน่งใน browser",
          2: lang==="en" ? "Location unavailable" : "หาตำแหน่งไม่ได้",
          3: lang==="en" ? "Request timed out — try again" : "หมดเวลา ลองอีกครั้ง",
        };
        setLocError(msgs[err.code] || (lang==="en"?"Could not get location":"ไม่สามารถหาตำแหน่งได้"));
        console.warn("[geolocation]", err.code, err.message);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  };

  const sportOpts = [
    { id:"all",        label: lang==="en" ? "All" : "ทั้งหมด" },
    { id:"tennis",     label: lang==="en" ? "Tennis" : "เทนนิส" },
    { id:"pickleball", label: lang==="en" ? "Pickleball" : "พิกเคิลบอล" },
  ];

  return (
    <section id="map" className="section-pad" style={{background:"#000", color:"#f5f5f7"}}>
      <div className="container" style={{textAlign:"center", marginBottom:24}}>
        <div className="eyebrow" style={{color:"#86868b", marginBottom:10}}>
          {lang==="en"?"All courts. One map.":"สนามทั้งหมด แผนที่เดียว"}
        </div>
        <p className="subhead" style={{color:"#a1a1a6", maxWidth:580, margin:"0 auto"}}>
          {lang==="en" ? "Tap any pin for details." : "คลิกหมุดเพื่อดูรายละเอียด"}
        </p>
      </div>
      <div className="container" style={{display:"flex", justifyContent:"center", marginBottom:18}}>
        <div className="map-sport-toggle">
          {sportOpts.map(opt => (
            <button key={opt.id}

// ─── COURT LIST SECTION (per sport — Apple style with our filters) ──────────
function CourtListSection({id, lang, sport, courts, allCount, onSelectCourt, dark, title, subtitle, searchQ, sortBy, setSortBy}) {
  const [filterType, setFilterType] = useState("all");
  const [toggles, setToggles] = useState({indoor:false, aircon:false, nightLights:false, hasBTS:false});

  const filtered = courts.filter(c => {
    if (filterType!=="all" && !courtHasType(c, filterType)) return false;
    if (toggles.indoor && !c.indoor) return false;
    if (toggles.aircon && !c.aircon) return false;
    if (toggles.nightLights && !c.nightLights) return false;
    if (toggles.hasBTS && !c.bts) return false;
    if (searchQ && !c.nameTh.includes(searchQ) && !c.name.toLowerCase().includes(searchQ.toLowerCase()) && !c.district.includes(searchQ) && !c.zone.includes(searchQ)) return false;
    return true;
  }).sort((a,b)=>
    sortBy==="featured"?(Number(isFeatured(b))-Number(isFeatured(a)))||((b.rating??0)-(a.rating??0))
    :sortBy==="rating"?(b.rating??0)-(a.rating??0)
    :sortBy==="price"?(a.priceMin??Infinity)-(b.priceMin??Infinity)
    :sortBy==="name"?a.nameTh.localeCompare(b.nameTh,"th")
    :sortBy==="nameEn"?a.name.localeCompare(b.name,"en")
    :(b.courts??0)-(a.courts??0)
  );

  const availableTypes = sport==="tennis" ? ["all","hard","clay","grass"] : ["all","hard"];
  const muted = dark ? "#a1a1a6" : "#6e6e73";
  const subtle = "#86868b";
  const chipBorder = dark ? "rgba(255,255,255,0.18)" : "var(--gray-3)";

  return (
    <section id={id} className="section-pad" style={{background: dark ? "#000" : "#fff", color: dark ? "#f5f5f7" : "var(--near-black)"}}>
      <div className="container-wide">
        <div style={{marginBottom:42, maxWidth:760}}>
          <div className="eyebrow" style={{color:subtle, marginBottom:14}}>
            {sport==="tennis"?(lang==="en"?"Tennis":"เทนนิส"):(lang==="en"?"Pickleball":"พิกเคิลบอล")} · {allCount} {lang==="en"?"courts":"สนาม"}
          </div>
          <h2 className="headline headline-lg" style={{marginBottom:14}}>{title}</h2>
          <p className="subhead" style={{color: dark?"#a1a1a6":"#6e6e73"}}>{subtitle}</p>
        </div>

        {/* Filter chips + toggles + sort */}
        <div style={{display:"flex", gap:10, marginBottom:36, flexWrap:"wrap", alignItems:"center"}}>
          <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
            {availableTypes.map(t => (
              <button key={t} onClick={()=>setFilterType(t)} style={{
                padding:"7px 16px", borderRadius:980, fontSize:13, fontWeight:400,
                background: filterType===t ? (dark?"#fff":"var(--near-black)") : "transparent",
                color: filterType===t ? (dark?"#000":"#fff") : (dark?"#f5f5f7":"var(--near-black)"),
                border: filterType===t ? "1px solid transparent" : `1px solid ${chipBorder}`,
                transition:"all 0.18s",
              }}>{t==="all"?(lang==="en"?"All":"ทั้งหมด"):(lang==="en"?TYPE_EN[t]:TYPE_LABELS[t])}</button>
            ))}
          </div>
          <div style={{width:1, height:24, background:chipBorder}}/>
          <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
            {[
              {k:"indoor", th:"ในร่ม", en:"Indoor"},
              {k:"aircon", th:"แอร์", en:"AC"},
              {k:"nightLights", th:"กลางคืน", en:"Night"},
              {k:"hasBTS", th:"ใกล้ BTS", en:"BTS"},
            ].map(({k,th,en})=>(
              <button key={k} onClick={()=>setToggles(t=>({...t, [k]:!t[k]}))} style={{
                padding:"7px 14px", borderRadius:980, fontSize:13, fontWeight:400,
                background: toggles[k] ? "var(--accent)" : "transparent",
                color: toggles[k] ? "#000" : (dark?"#f5f5f7":"var(--near-black)"),
                border: toggles[k] ? "1px solid transparent" : `1px solid ${chipBorder}`,
              }}>{lang==="en"?en:th}</button>
            ))}
          </div>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{
            marginLeft:"auto", padding:"7px 14px", borderRadius:980,
            border:`1px solid ${chipBorder}`, background:"transparent",
            color: dark?"#f5f5f7":"var(--near-black)", fontSize:13, fontFamily:"inherit", outline:"none",
          }}>
            <option value="featured" style={{color:"#000"}}>⭐ {lang==="en"?"Recommended":"แนะนำ"}</option>
            <option value="rating" style={{color:"#000"}}>★ {lang==="en"?"Rating":"คะแนน"}</option>
            <option value="price" style={{color:"#000"}}>฿ {lang==="en"?"Price":"ราคา"}</option>
            <option value="courts" style={{color:"#000"}}>🎾 {lang==="en"?"Most Courts":"คอร์ด"}</option>
            <option value="name" style={{color:"#000"}}>ก–ฮ</option>
            <option value="nameEn" style={{color:"#000"}}>A–Z</option>
          </select>
        </div>

        {filtered.length === 0 ? (
          <div style={{textAlign:"center", padding:60, color:muted}}>
            <div style={{fontSize:18, fontWeight:500, marginBottom:8}}>{lang==="en"?"No courts found":"ไม่พบสนามที่ตรงกัน"}</div>
            <div style={{fontSize:14, color:subtle}}>{lang==="en"?"Try adjusting filters":"ลองปรับตัวกรองใหม่"}</div>
          </div>
        ) : (
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))", gap:18}}>
            {filtered.map(c => <CourtCard key={c.id} court={c} onClick={onSelectCourt} theme={dark?"dark":"light"} lang={lang}/>)}
          </div>
        )}
      </div>
    </section>
  );
}

  const [sport, setSport] = useState("tennis");
  const [searchQ, setSearchQ] = useState("");

  const [sortBy, setSortBy] = useState("featured");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme==="dark");
  }, [theme]);

  return (
    <div>
      <Nav lang={lang} setLang={(l)=>setTweak("lang", l)} sport={sport} setSport={setSport}/>

        lang={lang} sport={sport} setSport={setSport}

      <CourtListSection
        id="tennis-list"
        lang={lang} sport="tennis" courts={TENNIS_COURTS} allCount={TENNIS_COURTS.length}
        onSelectCourt={setSelectedCourt} dark={false}
        title={lang==="en" ? <>Tennis in Bangkok.<br/>From ฿{Math.min(...TENNIS_COURTS.map(c=>c.priceMin).filter(p=>p!=null&&p>0))} / hour.</> : <>เทนนิสในกรุงเทพฯ<br/>เริ่มต้น ฿{Math.min(...TENNIS_COURTS.map(c=>c.priceMin).filter(p=>p!=null&&p>0))} / ชม.</>}
        subtitle={lang==="en" ? `${TENNIS_COURTS.length} clubs and public courts. Booking direct, no apps.` : `${TENNIS_COURTS.length} สโมสรและสนามสาธารณะ จองตรงกับสนาม`}
        searchQ={searchQ} sortBy={sortBy} setSortBy={setSortBy}
      />

      <CourtListSection
        id="pickleball-list"
        lang={lang} sport="pickleball" courts={PICKLEBALL_COURTS} allCount={PICKLEBALL_COURTS.length}
        onSelectCourt={setSelectedCourt} dark={true}
        title={lang==="en" ? <>Pickleball is here.<br/>And it's growing fast.</> : <>พิกเคิลบอลมาแล้ว<br/>และกำลังเติบโต</>}
        subtitle={lang==="en" ? `${PICKLEBALL_COURTS.length} dedicated venues across Bangkok.` : `${PICKLEBALL_COURTS.length} สนามเฉพาะทั่วกรุงเทพฯ`}
        searchQ={searchQ} sortBy={sortBy} setSortBy={setSortBy}
      />

      {/* CTA */}
      <section id="help" className="section-pad" style={{background:"#000", color:"#f5f5f7", paddingLeft:22, paddingRight:22, textAlign:"center"}}>
        <h2 className="headline headline-lg" style={{marginBottom:18}}>
          {lang==="en" ? <>Ready to play?</> : <>พร้อมเล่นแล้ว?</>}
        </h2>
        <p className="subhead" style={{color:"#a1a1a6", maxWidth:540, margin:"0 auto 36px"}}>
          {lang==="en"
            ? "Pick a court above, or open the map and find what's nearest."
            : "เลือกสนามด้านบน หรือเปิดแผนที่ดูสนามที่ใกล้คุณ"}
        </p>
        <div style={{display:"flex", gap:14, justifyContent:"center", flexWrap:"wrap"}}>
          <a href="#featured" className="btn-pill">{lang==="en"?"Browse courts":"ดูสนาม"}</a>
          <a href="#map" className="btn-pill alt">{lang==="en"?"Open the map":"เปิดแผนที่"}</a>
        </div>
      </section>

      <Footer lang={lang}/>

      {selectedCourt && <CourtDetailModal court={selectedCourt} onClose={()=>setSelectedCourt(null)} theme={theme} lang={lang}/>}

      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakRadio id="theme" label="Theme" options={[{value:"light",label:"Light"},{value:"dark",label:"Dark"}]}/>
        </TweakSection>
        <TweakSection title="Language">
          <TweakRadio id="lang" label="Lang" options={[{value:"th",label:"ไทย"},{value:"en",label:"EN"}]}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
