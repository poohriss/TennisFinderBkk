<script type="text/babel">
// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────────
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;
const TweaksContext = React.createContext(null);
const _tweaksRef = { current: null };
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  _tweaksRef.current = [values, setTweak];
  return [values, setTweak];
}
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current; if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) ro.observe(document.documentElement); else window.addEventListener('resize', clampToViewport);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', clampToViewport); };
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = e => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = ev => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <TweaksContext.Provider value={_tweaksRef.current}>
        <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      </TweaksContext.Provider>
    </>
  );
}
function TweakSection({ label, title, children }) {
  return <><div className="twk-sect">{title ?? label}</div>{children}</>;
}
function TweakToggle({ id, label, value, onChange }) {
  const ctx = React.useContext(TweaksContext);
  const val = value !== undefined ? value : (ctx?.[0]?.[id] ?? false);
  const change = onChange ?? (v => ctx?.[1]?.(id, v));
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={val ? '1' : '0'} role="switch" aria-checked={!!val} onClick={() => change(!val)}><i /></button>
    </div>
  );
}
function TweakRadio({ id, label, value, options, onChange }) {
  const ctx = React.useContext(TweaksContext);
  const val = value !== undefined ? value : ctx?.[0]?.[id];
  const change = onChange ?? (v => ctx?.[1]?.(id, v));
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === val));
  const n = opts.length;
  const valRef = React.useRef(val); valRef.current = val;
  const segAt = cx => { const r = trackRef.current.getBoundingClientRect(); return opts[Math.max(0, Math.min(n-1, Math.floor(((cx-r.left-2)/(r.width-4))*n)))].value; };
  const onPointerDown = e => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valRef.current) change(v0);
    const move = ev => { const v = segAt(ev.clientX); if (v !== valRef.current) change(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === val}>{o.label}</button>)}
      </div>
    </div>
  );
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakRadio });
</script>

// ─── COURT SVG (correct tennis court layout) ─────────────────────────────────
function CourtSVG({type}) {
  const L = "rgba(255,255,255,0.55)";
  const S = "rgba(255,255,255,0.32)";
  const W = 130, H = 60;
  const ml = 5, mr = W-5, mt = 4, mb = H-4;
  const alley = (mb - mt) * (4.5/36);
  const st = mt + alley, sb = mb - alley;
  const net = W / 2;
  const svcFrac = 21/39;
  const svcL = net - (net - ml) * svcFrac;
  const svcR = net + (mr - net) * svcFrac;
  const cy = (mt + mb) / 2;
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none">
      <rect x={ml} y={mt} width={mr-ml} height={mb-mt} stroke={L} strokeWidth="1.8"/>
      <line x1={ml} y1={st} x2={mr} y2={st} stroke={S} strokeWidth="1.1"/>
      <line x1={ml} y1={sb} x2={mr} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={net} y1={mt} x2={net} y2={mb} stroke={L} strokeWidth="2.2"/>
      <circle cx={net} cy={mt} r="1.8" fill={L}/>
      <circle cx={net} cy={mb} r="1.8" fill={L}/>
      <line x1={svcL} y1={st} x2={svcL} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={svcR} y1={st} x2={svcR} y2={sb} stroke={S} strokeWidth="1.1"/>
      <line x1={svcL} y1={cy} x2={svcR} y2={cy} stroke={S} strokeWidth="1.1"/>
      <line x1={ml} y1={cy-2.5} x2={ml} y2={cy+2.5} stroke={L} strokeWidth="1.6"/>
      <line x1={mr} y1={cy-2.5} x2={mr} y2={cy+2.5} stroke={L} strokeWidth="1.6"/>
    </svg>
  );
}

      border: darkTheme ? "1px solid #243228" : "1px solid var(--border)",
      borderRadius:"var(--radius)", padding:0, cursor:"pointer",
      transition:"all 0.2s cubic-bezier(0.2,0,0,1)",

                 <span style={{fontSize:12,color:darkTheme?"#6a8a6a":"var(--text-muted)"}}>{court.priceMax>court.priceMin?`–${court.priceMax.toLocaleString()}`:""}/ชม.</span></>

// ─── MAP VIEW ────────────────────────────────────────────────────────────────
function MapView({courts, onSelectCourt, theme, sport}) {
  const darkTheme = theme === "dark";
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersRef = useRef([]);

  // init map once
  useEffect(() => {
    if (!mapRef.current || leafletMap.current) return;
    const L = window.L;
    const map = L.map(mapRef.current, { center:[13.7563,100.5018], zoom:12 });
    L.tileLayer(
      darkTheme ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
                : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      { attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>', maxZoom:19 }
    ).addTo(map);
    leafletMap.current = map;
    return () => { map.remove(); leafletMap.current = null; delete window.__selectCourt; };
  }, []);

  // update markers whenever courts changes
  useEffect(() => {
    const map = leafletMap.current;
    if (!map) return;
    const L = window.L;
    const icon = sport === "pickleball" ? "🏓" : "🎾";
    // clear old markers
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    // add new markers
    courts.forEach(court => {
      const m = L.marker([court.lat, court.lng], { icon: L.divIcon({
        className:"",
        html:`<div style="width:36px;height:36px;background:${court.featured?"oklch(0.90 0.16 96)":"var(--green)"};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:16px;">${icon}</span></div>`,
        iconSize:[36,36], iconAnchor:[18,36], popupAnchor:[0,-38],
      })}).addTo(map).bindPopup(`
        <div style="font-family:'Noto Sans Thai',sans-serif;min-width:200px;padding:4px 0">
          <div style="font-weight:700;font-size:15px;margin-bottom:4px">${court.nameTh}</div>
          <div style="font-size:12px;color:#666;margin-bottom:6px">${court.name}</div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <span style="font-weight:700;color:oklch(0.52 0.15 150);font-size:16px">${court.priceMin===0?"ฟรี":"฿"+court.priceMin.toLocaleString()}</span>
            <span style="font-size:11px;color:#999">${court.priceMin===0?"":"/ชม."}</span>
            <span style="margin-left:auto;color:#f0a800;font-weight:600">★ ${court.rating}</span>
          </div>
          <div style="font-size:12px;color:#555;margin-bottom:8px">📍 ${court.district}${court.bts?` · ${court.bts}`:""}</div>
          <button onclick="window.__selectCourt(${court.id})" style="width:100%;padding:8px;background:oklch(0.52 0.15 150);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">ดูข้อมูลติดต่อ →</button>
        </div>`, { maxWidth:260 });
      markersRef.current.push(m);
    });
    window.__selectCourt = id => {
      const c = courts.find(c=>c.id===id);
      if (c) onSelectCourt(c);
    };
  }, [courts, sport]);

  return (
    <div style={{display:"flex",gap:16,height:"calc(100vh - 160px)",minHeight:500}}>
      <div ref={mapRef} style={{flex:1,borderRadius:"var(--radius)",overflow:"hidden",border:`1px solid ${darkTheme?"#243228":"#c8d8c8"}`,zIndex:0}}/>
      <div style={{width:280,overflow:"auto",display:"flex",flexDirection:"column",gap:8}}>
        {courts.map(court => (
          <div key={court.id} onClick={()=>{onSelectCourt(court);leafletMap.current?.setView([court.lat,court.lng],15);}} style={{background:darkTheme?"#162018":"#fff",border:`1px solid ${darkTheme?"#243228":"var(--border)"}`,borderRadius:14,padding:"12px 14px",cursor:"pointer",transition:"all 0.15s"}}>
            <div style={{fontWeight:700,fontSize:14,color:darkTheme?"#cce8cc":"var(--text)",letterSpacing:"-0.01em"}}>{court.nameTh}</div>
            <div style={{fontSize:12,color:"var(--text-muted)",marginTop:2}}>📍 {court.district}</div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6,alignItems:"center"}}>
              <span style={{fontWeight:700,color:"var(--green)",fontSize:14}}>{court.priceMin===0?"ฟรี":<>฿{court.priceMin.toLocaleString()}<span style={{fontSize:11,fontWeight:400,color:"#999"}}>/ชม.</span></>}</span>
              <StarRating rating={court.rating}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

              <div style={{display:"flex",alignItems:"center",flex:1,minWidth:160,gap:4}}>
                <span style={{color:"#aaa",fontSize:15}}>🔍</span>
                <input placeholder={lang==="en"?"Search courts, district...":"ค้นหาสนาม, เขต..."} value={searchQ} onChange={e=>setSearchQ(e.target.value)} style={{flex:1,padding:"4px 0",border:"none",outline:"none",background:"transparent",fontSize:14,fontFamily:"inherit",color:"var(--text)"}}/>
                {searchQ && <button onClick={()=>setSearchQ("")} style={{background:"none",border:"none",cursor:"pointer",color:"#aaa",fontSize:14,padding:0}}>✕</button>}
              </div>
              <div style={{width:1,height:24,background:"var(--border)",flexShrink:0}}/>
              <div style={{display:"flex",gap:6}}>
                {ACTIVE_TYPES.filter(t=>t.k!=="all").map(t=>(
                  <button key={t.k} onClick={()=>setFilters(f=>({...f,type:f.type===t.k?"all":t.k}))} style={{padding:"5px 11px",borderRadius:20,border:"1.5px solid",borderColor:filters.type===t.k?TYPE_COLORS[t.k]:"var(--border)",background:filters.type===t.k?TYPE_COLORS[t.k]+"22":"transparent",color:filters.type===t.k?TYPE_COLORS[t.k]:"var(--text-muted)",fontSize:12,fontWeight:filters.type===t.k?600:400,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",transition:"all 0.15s"}}>{lang==="en"?t.en:t.th}</button>
                ))}
              </div>
              <div style={{width:1,height:24,background:"var(--border)",flexShrink:0}}/>
              <div style={{display:"flex",gap:6}}>
                {[{k:"indoor",th:"ในร่ม",en:"Indoor"},{k:"aircon",th:"มีแอร์",en:"AC"},{k:"nightLights",th:"ไฟกลางคืน",en:"Night Lights"},{k:"hasBTS",th:"ใกล้ BTS",en:"Near BTS"}].map(({k,th,en})=>(
                  <button key={k} onClick={()=>setFilters(f=>({...f,[k]:!f[k]}))} style={{padding:"5px 11px",borderRadius:20,border:"1.5px solid",borderColor:filters[k]?"var(--green)":"var(--border)",background:filters[k]?"var(--green)":"transparent",color:filters[k]?"#fff":"var(--text-muted)",fontSize:12,fontWeight:filters[k]?600:400,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",transition:"all 0.15s"}}>{lang==="en"?en:th}</button>
                ))}
              </div>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"5px 10px",borderRadius:10,border:`1px solid var(--border)`,background:"transparent",color:"var(--text-muted)",fontSize:12,cursor:"pointer",fontFamily:"inherit",outline:"none"}}>
                <option value="rating">★ {lang==="en"?"Top Rated":"คะแนน"}</option>
                <option value="price">฿ {lang==="en"?"Cheapest":"ราคา"}</option>
                <option value="courts">🎾 {lang==="en"?"Most Courts":"คอร์ด"}</option>
                <option value="name">{lang==="en"?"ก–ฮ Thai A–Z":"ก–ฮ ตัวอักษร"}</option>
                <option value="nameEn">{lang==="en"?"A–Z Alphabetical":"A–Z อังกฤษ"}</option>
              </select>
            </div>

            <div style={{marginBottom:14,color:"var(--text-muted)",fontSize:13,paddingLeft:4}}>
              {lang==="en"?`${filtered.length} courts`:`พบ ${filtered.length} สนาม`}
              {(searchQ||filters.type!=="all"||filters.indoor||filters.aircon||filters.nightLights||filters.hasBTS) && (
                <button onClick={()=>{setSearchQ("");setFilters({zone:"ทั้งหมด",type:"all",maxPrice:2000,indoor:false,aircon:false,nightLights:false,hasBTS:false,openTime:"all"});}} style={{marginLeft:10,color:"var(--green)",background:"none",border:"none",cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:600}}>{lang==="en"?"Reset ✕":"รีเซ็ต ✕"}</button>
              )}
            </div>

            {filtered.length===0 ? (
              <div style={{textAlign:"center",padding:60,color:"var(--text-muted)"}}>
                <div style={{fontSize:48,marginBottom:16}}>🎾</div>
                <div style={{fontSize:18,fontWeight:600,marginBottom:8}}>{lang==="en"?"No courts found":"ไม่พบสนามที่ตรงกัน"}</div>
                <div style={{fontSize:14}}>{lang==="en"?"Try adjusting filters":"ลองปรับตัวกรองใหม่"}</div>
              </div>
            ) : (
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14,paddingBottom:40}}>
                {filtered.map(c=><CourtCard key={c.id} court={c} onClick={setSelectedCourt} theme={theme}/>)}
              </div>
            )}
          </div>
        )}

        {screen==="map" && (
          <div style={{paddingTop:20}}>
            <div style={{marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:6}}>
                {[{id:"tennis",label:"เทนนิส",labelEn:"Tennis"},{id:"pickleball",label:"พิกเคิลบอล",labelEn:"Pickleball"}].map(s=>(
                  <button key={s.id} onClick={()=>{setSport(s.id);}} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 18px",borderRadius:40,background:sport===s.id?"var(--green)":(darkTheme?"#162018":"#fff"),border:`1.5px solid ${sport===s.id?"var(--green)":"var(--border)"}`,color:sport===s.id?"#fff":"var(--text-muted)",fontWeight:sport===s.id?700:400,fontSize:14,cursor:"pointer",fontFamily:"inherit",transition:"all 0.18s",boxShadow:sport===s.id?"0 2px 12px rgba(0,100,40,0.2)":"var(--shadow)"}}>
                    {s.id==="tennis"
                      ? <span style={{fontSize:16}}>🎾</span>
                      : <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style={{flexShrink:0}}>
                          <rect x="5" y="1" width="11" height="12" rx="2.5" fill={sport===s.id?"#fff":"#1a1a1a"}/>
                          {[[8,3.5],[11,3.5],[8,6.5],[11,6.5],[8,9.5],[11,9.5]].map(([cx,cy],i)=>(
                            <circle key={i} cx={cx} cy={cy} r="0.9" fill={sport===s.id?"var(--green)":"#fff"}/>
                          ))}
                          <rect x="9" y="13" width="3" height="4.5" rx="1.5" fill={sport===s.id?"#fff":"#1a1a1a"}/>
                          <circle cx="3" cy="14.5" r="2.5" fill="#f97316"/>
                          {[[3,13.3],[1.9,15],[4.1,15]].map(([cx,cy],i)=>(
                            <circle key={i} cx={cx} cy={cy} r="0.55" fill="rgba(255,255,255,0.65)"/>
                          ))}
                        </svg>
                    }
                    {lang==="en"?s.labelEn:s.label}
                    <span style={{background:sport===s.id?"rgba(255,255,255,0.25)":(darkTheme?"#243228":"var(--green-light)"),color:sport===s.id?"#fff":"var(--green-dark)",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:600}}>{s.id==="tennis"?TENNIS_COURTS.length:PICKLEBALL_COURTS.length}</span>
                  </button>
                ))}
              </div>
              <span style={{fontSize:13,color:"var(--text-muted)"}}>{lang==="en"?"Click a pin to see details":"คลิกหมุดเพื่อดูรายละเอียด"}</span>
            </div>
            <MapView courts={COURTS} onSelectCourt={setSelectedCourt} theme={theme} sport={sport}/>
          </div>
        )}
      </div>

      {selectedCourt && <CourtDetailModal court={selectedCourt} onClose={()=>setSelectedCourt(null)} theme={theme}/>}

      <TweaksPanel>
        <TweakSection title="ธีม / Theme">
          <TweakRadio id="theme" label="สีสัน" options={[{value:"light",label:"☀️ Light"},{value:"dark",label:"🌙 Dark"},{value:"bold",label:"🌿 Bold"}]}/>
        </TweakSection>
        <TweakSection title="ภาษา / Language">
          <TweakRadio id="lang" label="ภาษา" options={[{value:"th",label:"ไทย"},{value:"en",label:"EN"}]}/>
        </TweakSection>
        <TweakSection title="การแสดงผล">
          <TweakToggle id="showFeaturedOnly" label="แสดงสนามแนะนำเท่านั้น"/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
